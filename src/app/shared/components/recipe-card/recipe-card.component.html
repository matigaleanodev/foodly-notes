<ion-card class="recipe-card">
  <button type="button" class="recipe-open" [attr.aria-label]="('xVerReceta' | translate) + ': ' + recipe().title" (click)="toRecipeDetail($event)">
    <img class="recipe-card-image" [src]="recipeImageUrl()" alt="" loading="lazy" (error)="onImageError($event)" />
    <h2 class="recipe-card-title">{{ recipe().title }}</h2>
  </button>
  <div class="recipe-card-actions">
    <ion-button fill="clear" [color]="isFavorite() ? 'danger' : 'primary'" [attr.aria-label]="((isFavorite() ? 'xQuitarFavorito' : 'xAgregarFavorito') | translate) + ': ' + recipe().title" [attr.aria-pressed]="isFavorite()" (click)="toggleFavoriteState($event)">
      <ion-icon slot="start" name="heart" aria-hidden="true" />{{ (isFavorite() ? 'xGuardada' : 'xGuardar') | translate }}
    </ion-button>
    <ion-button fill="clear" [attr.aria-label]="('xVerSimilares' | translate) + ': ' + recipe().title" (click)="toSimilarRecipes($event)">
      <ion-icon slot="start" name="repeat" aria-hidden="true" />{{ 'xSimilares' | translate }}
    </ion-button>
  </div>
</ion-card>
