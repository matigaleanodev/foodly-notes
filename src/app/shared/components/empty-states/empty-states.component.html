<div class="empty-state-container" role="status">
  <img
    [src]="'assets/empty-states/' + imagen() + '.png'"
    alt=""
    aria-hidden="true"
  />

  <p class="empty-state-text">
    {{ text() | translate }}
  </p>
  @if (actionKey(); as key) {
    <button type="button" class="foodly-button" (click)="action.emit()">{{ key | translate }}</button>
  }
</div>
