<div class="recipe-meta">
  <div class="meta-info">
    <span>{{ 'xListoEn' | translate }}: {{ readyInMinutes() }} min</span>
    <span>{{ 'xPorciones' | translate }}: {{ servings() }}</span>
  </div>
  <div class="meta-actions">
    <ion-button fill="clear" [color]="isFavorite() ? 'danger' : 'primary'" [attr.aria-label]="(isFavorite() ? 'xQuitarFavorito' : 'xAgregarFavorito') | translate" [attr.aria-pressed]="isFavorite()" (click)="toggleFavorite.emit()">
      <ion-icon slot="start" name="heart-outline" aria-hidden="true" />{{ (isFavorite() ? 'xGuardada' : 'xGuardar') | translate }}
    </ion-button>
    <ion-button fill="clear" (click)="viewSimilar.emit()"><ion-icon slot="start" name="repeat-outline" aria-hidden="true" />{{ 'xSimilares' | translate }}</ion-button>
  </div>
</div>
