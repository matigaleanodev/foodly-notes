<section class="instructions">
  <h2 class="instructions-title">
    {{ "xPreparacion" | translate }}
  </h2>

  <ol role="list">
  @for (block of instructions(); track $index) {
    @for (step of block.steps; track step.number) {
      <li class="instruction-step">
        <span class="step-number" aria-hidden="true">
          {{ step.number }}
        </span>

        <p class="step-text">
          {{ step.text }}
        </p>
      </li>
    }
  }
  </ol>
</section>
