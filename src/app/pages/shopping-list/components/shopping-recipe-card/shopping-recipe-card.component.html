<section class="ingredients-paper">
  <div class="paper-margin" aria-hidden="true"></div>
  <div class="paper-content">
    <h2 class="paper-title">{{ recipe().title }}</h2>
    <p class="paper-subtitle">{{ "xMarcaIngredientes" | translate }}</p>
    <ul>
      @for (ingredient of ingredients(); track ingredient.id) {
        <li class="paper-line">
          <ion-checkbox [checked]="isIngredientChecked(ingredient.id)" (ionChange)="toggleIngredient($event, ingredient.id)">
            {{ ingredient.name }} ({{ ingredient.amount }}{{ ingredient.unit ? ' ' + ingredient.unit : '' }})
          </ion-checkbox>
        </li>
      }
    </ul>
  </div>
  <div class="paper-footer">
    <ion-button fill="clear" (click)="goToRecipe()">{{ "xVerReceta" | translate }}<ion-icon aria-hidden="true" slot="end" name="arrow-forward" /></ion-button>
  </div>
</section>
