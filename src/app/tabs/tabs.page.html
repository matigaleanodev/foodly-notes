<ion-tabs>
  <nav slot="bottom" [attr.aria-label]="'xNavegacionPrincipal' | translate">
  <ion-tab-bar>
    @for (tab of tabs(); track $index) {
    <ion-tab-button [tab]="tab.path" [routerLink]="tab.path">
      <ion-icon aria-hidden="true" [name]="tab.icon"></ion-icon>
      <ion-label>{{ tab.label | translate }}</ion-label>
    </ion-tab-button>
    }
  </ion-tab-bar>
  </nav>
</ion-tabs>
