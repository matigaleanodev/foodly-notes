name: Sync Dev From Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-from-main
  cancel-in-progress: false

jobs:
  sync-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main and dev
        run: git fetch origin main dev

      - name: Sync main into dev
        run: |
          git checkout -B dev origin/dev
          git merge --no-ff origin/main -m "chore(ci): sincronizacion automatica de main hacia dev"
          git push origin dev
